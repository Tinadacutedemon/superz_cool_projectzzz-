<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📚 Mettaton's Quiz - Refuerzo Escolar</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           GLOBAL RESET & BASE — BLACK & WHITE ONLY
           ============================================================ */
        * {
            box-sizing: border-box;
            user-select: none;
            image-rendering: pixelated;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
            font-family: 'VT323', 'Courier New', monospace;
        }

        .game-wrapper {
            background: #000000;
            padding: 16px 18px 22px;
            border-radius: 12px;
            box-shadow: 0 0 0 4px #ffffff, inset 0 0 0 4px #000000;
            max-width: 960px;
            width: 100%;
            border: 2px solid #ffffff;
            position: relative;
        }

        .game-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0) 0px,
                    rgba(0, 0, 0, 0) 3px,
                    rgba(0, 0, 0, 0.08) 3px,
                    rgba(0, 0, 0, 0.08) 4px);
            pointer-events: none;
            border-radius: 12px;
            z-index: 30;
        }

        #arenaContainer {
            position: relative;
            background: #000000;
            border: 4px solid #ffffff;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.05);
            aspect-ratio: 16 / 9;
            width: 100%;
            overflow: hidden;
        }

        #battleCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000000;
            cursor: none;
            touch-action: none;
        }

        .sprite-info {
            position: absolute;
            bottom: 8px;
            right: 12px;
            color: #444444;
            font-size: 0.5rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #333333;
            z-index: 5;
            pointer-events: none;
            font-family: 'Press Start 2P', monospace;
        }

        /* ============================================================
           UNDERTALE TEXTBOX
           ============================================================ */
        .textbox {
            background: #000000;
            border: 4px solid #ffffff;
            border-radius: 8px;
            padding: 20px 30px;
            max-width: 100%;
            margin: 8px 0 8px 0;
            position: relative;
            box-shadow: 0 0 0 2px #000000, inset 0 0 0 2px #000000;
            font-family: 'VT323', 'Courier New', monospace;
            color: #ffffff;
            font-size: 24px;
            line-height: 1.6;
            min-height: 90px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .textbox .text-content {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            position: relative;
        }

        .textbox .speaker-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            min-width: 80px;
        }

        .textbox .dialogue {
            margin: 0;
            padding: 0;
            flex: 1;
            color: #ffffff;
            white-space: pre-wrap;
        }

        .textbox .cursor {
            display: inline-block;
            width: 14px;
            height: 22px;
            background: #ffffff;
            animation: blink 0.6s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .textbox .heart-indicator {
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff0000;
            font-size: 20px;
            display: none;
            text-shadow: 0 0 15px #ff0000;
        }

        .textbox .heart-indicator.active {
            display: block;
        }

        .textbox .answer-option {
            display: block;
            padding: 4px 8px;
            margin: 2px 0;
            cursor: pointer;
            transition: all 0.1s ease;
            border-left: 3px solid transparent;
            color: #ffffff;
            font-size: 22px;
            position: relative;
        }

        .textbox .answer-option .option-heart {
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff0000;
            font-size: 16px;
            display: none;
            text-shadow: 0 0 10px #ff0000;
        }

        .textbox .answer-option.active .option-heart {
            display: block;
        }

        .textbox .answer-option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
        }

        .textbox .answer-option.selected-correct {
            background: rgba(255, 255, 255, 0.3);
            border-left-color: #ffffff;
            color: #ffffff;
        }

        .textbox .answer-option.selected-wrong {
            background: rgba(255, 255, 255, 0.1);
            border-left-color: #666666;
            color: #666666;
        }

        .enemy-hp-display {
            display: none;
            flex-basis: auto;
            align-items: center;
            gap: 10px;
            width: fit-content;
            max-width: 100%;
            margin: 10px auto 0;
            padding: 8px 10px;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
        }

        .enemy-hp-display.active {
            display: flex;
        }

        .enemy-hp-name {
            min-width: 120px;
            color: #ffff00;
        }

        .enemy-hp-bar {
            flex: 0 1 110px;
            width: 110px;
            height: 14px;
            background: #1a1a1a;
            border: 2px solid #ffffff;
        }

        .enemy-hp-bar span {
            display: block;
            width: 100%;
            height: 100%;
            background: #ff4444;
            transition: width 0.2s ease;
        }

        /* ============================================================
           ACTION BUTTONS
           ============================================================ */
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin: 6px 0 8px 0;
            position: relative;
        }

        .action-btn {
            background: #000000;
            color: #ffffff;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 0.7rem;
            padding: 12px 6px 12px 22px;
            border: 3px solid #ffffff;
            border-radius: 4px;
            box-shadow: 0 4px 0 #000000, inset 0 -2px 0 #333333;
            transition: 0.05s linear;
            cursor: pointer;
            text-align: center;
            letter-spacing: 1px;
            position: relative;
        }

        #fightBtn {
            border-color: #ff5c3d;
            color: #ff5c3d;
        }
        #actBtn {
            border-color: #4fc3f7;
            color: #4fc3f7;
        }
        #itemBtn {
            border-color: #66bb6a;
            color: #66bb6a;
        }
        #mercyBtn {
            border-color: #ffd54f;
            color: #ffd54f;
        }

        .action-btn:hover:not(:disabled) {
            background: #1a1a1a;
        }

        .action-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #000000;
        }

        .action-btn:disabled {
            opacity: 0.3;
            transform: translateY(4px);
            box-shadow: 0 0px 0 #000000;
            cursor: not-allowed;
        }

        .action-btn.active {
            background: #ffe135;
            border-color: #ffe135;
            color: #1a1400;
            box-shadow: 0 4px 0 #7a6600, inset 0 -2px 0 #c9a900;
        }

        .action-btn .heart-indicator {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff0000;
            font-size: 14px;
            display: none;
            text-shadow: 0 0 10px #ff0000;
        }

        .action-btn.active .heart-indicator {
            display: block;
        }

        .options-grid {
            display: none;
        }

        /* ============================================================
           STATUS PANEL
           ============================================================ */
        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: #000000;
            padding: 6px 14px;
            border: 3px solid #ffffff;
            border-radius: 6px;
            margin-top: 4px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-name {
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            padding: 3px 12px;
            border: 2px solid #ffffff;
            border-radius: 4px;
            background: #000000;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
        }

        .subject-display {
            color: #4fc3f7;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            padding: 3px 10px;
            border: 2px solid #4fc3f7;
            border-radius: 4px;
            background: #000000;
            letter-spacing: 1px;
            text-align: center;
        }

        .hp-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #000000;
            padding: 3px 12px;
            border: 2px solid #ffffff;
            border-radius: 4px;
        }

        .hp-label {
            color: #ff4444;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
        }

        .hp-bar-outer {
            width: 120px;
            height: 14px;
            background: #1a1a1a;
            border: 2px solid #444444;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .hp-bar-inner {
            height: 100%;
            background: #ff4444;
            transition: width 0.3s ease;
            border-radius: 1px;
        }

        .hp-text {
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            min-width: 30px;
            text-align: center;
        }

        .hp-text.temmie-hp {
            color: #ff66aa;
            font-size: 0.7rem;
            text-shadow: 0 0 10px #ff66aa;
            animation: temmiePulse 0.8s ease-in-out infinite;
        }

        @keyframes temmiePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rating-display {
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            padding: 3px 12px;
            border: 2px solid #ffffff;
            border-radius: 4px;
            background: #000000;
        }

        #feedbackMessage {
            color: #ffffff;
            font-size: 0.55rem;
            padding: 3px 12px;
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 4px;
            flex: 1;
            min-width: 80px;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
        }

        /* ============================================================
           NAME INPUT MODAL
           ============================================================ */
        .name-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Press Start 2P', monospace;
        }

        .name-modal-content {
            background: #000000;
            border: 4px solid #ffffff;
            border-radius: 12px;
            padding: 40px 50px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 0 2px #000000, inset 0 0 0 2px #000000;
        }

        .name-modal-title {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .name-modal-input {
            background: #000000;
            border: 3px solid #ffffff;
            border-radius: 4px;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            padding: 12px 16px;
            width: 100%;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
        }

        .name-modal-input:focus {
            border-color: #ffe135;
            box-shadow: 0 0 20px rgba(255, 225, 53, 0.2);
        }

        .name-modal-input::placeholder {
            color: #444444;
            font-size: 0.8rem;
        }

        .name-modal-submit {
            background: #000000;
            border: 3px solid #ffffff;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 12px 30px;
            border-radius: 4px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #000000;
        }

        .name-modal-submit:hover {
            background: #1a1a1a;
            border-color: #ffe135;
        }

        .name-modal-submit:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #000000;
        }

        .name-modal-hint {
            color: #444444;
            font-size: 0.5rem;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        /* ============================================================
           SUBJECT SELECTOR MODAL
           ============================================================ */
        .subject-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Press Start 2P', monospace;
        }

        .subject-modal.active {
            display: flex;
        }

        .subject-modal-content {
            background: #000000;
            border: 4px solid #ffffff;
            border-radius: 12px;
            padding: 30px 40px;
            max-width: 700px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 0 2px #000000, inset 0 0 0 2px #000000;
        }

        .subject-modal-title {
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-align: center;
        }

        .subject-modal-subtitle {
            color: #888888;
            font-size: 0.6rem;
            text-align: center;
            margin-bottom: 20px;
            font-family: 'VT323', monospace;
            letter-spacing: 1px;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .subject-btn {
            background: #000000;
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 8px;
            padding: 16px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            line-height: 1.6;
        }

        .subject-btn:hover {
            background: #1a1a1a;
            border-color: #ffe135;
            transform: scale(1.02);
        }

        .subject-btn:active {
            transform: scale(0.95);
        }

        .subject-btn .subject-icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 6px;
        }

        .subject-btn .subject-label {
            font-size: 0.5rem;
            color: #aaaaaa;
        }

        .subject-btn.matematicas {
            border-color: #ff5c3d;
        }
        .subject-btn.matematicas:hover {

        .subject-btn.musica:hover {

            background: #2a1a0a;
        }

        function loadAllSprites() {
            const spritePaths = {
                mettaton: METTATON_SPRITE_SRC,
                mettaton_ex: METTATON_EX_SPRITE_SRC,
                mr_tenna: MR_TENNA_SPRITE_SRC,

                tina: TINA_SPRITE_SRC,
                marie: MARIE_SPRITE_SRC,
                gerson: GERSON_SPRITE_SRC
            };

            let loadedCount = 0;
            const totalSprites = Object.keys(spritePaths).length;

            for (const [key, path] of Object.entries(spritePaths)) {
                sprites[key] = new Image();
                sprites[key].onload = () => {
                    loadedCount++;
                    console.log(`✅ Sprite loaded: ${key}`);
                    if (loadedCount === totalSprites) {
                        allSpritesLoaded = true;
                        spriteLoaded = true;
                        currentSprite = sprites.mettaton;
                        console.log('✅ All sprites loaded!');
                    }
                };
                sprites[key].onerror = () => {
                    console.warn(`⚠️ Failed to load sprite: ${key} from ${path}`);
                    loadedCount++;
                    if (loadedCount === totalSprites) {
                        allSpritesLoaded = true;
                        spriteLoaded = true;
                        currentSprite = sprites.mettaton;
                        console.log('⚠️ Using fallback sprites (some may not load)');
                    }
                };
                sprites[key].src = path;
                console.log(`📁 Loading sprite: ${key} from ${path}`);
            }
        }

            isMettatonSpeaking = true;
            playVoiceBlip();
            scheduleNextBlip();
        }

        function scheduleNextBlip() {
            if (!isMettatonSpeaking) return;
            voiceBlip.onended = function() {
                if (isMettatonSpeaking) {
                    playVoiceBlip();
                    scheduleNextBlip();
                }
                voiceBlip.onended = null;
            };
            setTimeout(() => {
                if (isMettatonSpeaking && !voiceBlip.paused) {
                    // Still playing, wait
                } else if (isMettatonSpeaking) {
                    playVoiceBlip();
                }
            }, 500);
        }

        function stopVoiceBlips() {
            isMettatonSpeaking = false;
            if (voiceBlip) {
                voiceBlip.pause();
                voiceBlip.currentTime = 0;
            }
            voiceBlip.onended = null;
        }

        function scheduleVoiceStop(duration) {
            setTimeout(() => {

            isSecretWithSubject = false;
            showSubjectSelector();
            canvas.focus();
        }

        nameSubmit.addEventListener('click', startGameWithName);
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                startGameWithName();
            }
        });

        // ---------- SUBJECT BUTTON EVENTS ----------
        subjectGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('.subject-btn');
            if (btn) {
                const subject = btn.dataset.subject;
                selectSubject(subject);
            }
        });

        // ---------- ACT MODE ----------
        function startActMode() {
            if (state.gameOver || state.answered) return;

            const qData = getCurrentQuestionData();
            state.actMode = true;
            state.focusOnButtons = true;
            textCursor.style.display = 'inline-block';
            textboxHeart.classList.remove('active');

            state.battleSoul.x = BOX.x + BOX.w / 2;
            state.battleSoul.y = BOX.y + BOX.h - 26;

            const labels = ['A', 'B', 'C', 'D'];
            const positions = [
                { x: BOX.x + BOX.w * 0.27, y: BOX.y + BOX.h * 0.34 },
                { x: BOX.x + BOX.w * 0.73, y: BOX.y + BOX.h * 0.34 },
                { x: BOX.x + BOX.w * 0.27, y: BOX.y + BOX.h * 0.74 },
                { x: BOX.x + BOX.w * 0.73, y: BOX.y + BOX.h * 0.74 }
            ];
            state.actTargets = qData.options.map((option, index) => ({
                x: positions[index].x,
                y: positions[index].y,
                r: 54,
                label: labels[index] + '. ' + option,
                index
            }));

            textLabel.textContent = '💬 ACT ';
            textMessage.textContent = ' MUEVE EL ALMA Y PRESIONA Z EN TU RESPUESTA!';
            setFeedback('💬 ¡ELIGE SABIAMENTE, DARLING!');
            state.mettatonBubble = { active: true, text: qData.question };

            startVoiceBlips();
            const duration = Math.max(600, qData.question.length * 180 + 300);
            scheduleVoiceStop(duration);

            updateUI();
        }

        function selectActTarget() {
            if (!state.actMode || state.disabled || state.gameOver) return;
            const soul = state.battleSoul;
            const hitTarget = state.actTargets.find(t => {
                const dx = soul.x - t.x,
                    dy = soul.y - t.y;
                return Math.sqrt(dx * dx + dy * dy) < t.r;
            });
            if (!hitTarget) {
                setFeedback('💬 ¡ACÉRCATE MÁS A UNA RESPUESTA!');
                return;
            }
            state.actMode = false;
            state.actTargets = [];
            stopVoiceBlips();
            handleAnswer(hitTarget.index);
        }

        // ---------- UI UPDATE ----------
        function updateUI() {
            updateHPUI();
            updateRatingUI();

            if (state.gameOver) {
                if (state.hp <= 0) {
                    setFeedback('💔 GAME OVER... METTATON GANA.');
                } else if (state.rating >= 7) {
                    setFeedback('🌟 ¡LEGENDARIO! ¡METTATON APRUEBA!');
                } else if (state.rating >= 4) {
                    setFeedback('👍 ¡BUEN TRABAJO, DARLING!');
                } else {
                    setFeedback('📺 ¡MEJOR SUERTE LA PRÓXIMA VEZ!');
                }
                actionBtns.forEach(btn => btn.disabled = true);
                textboxHeart.classList.remove('active');
                stopVoiceBlips();
            } else {
                setFeedback(`📺 P${state.questionIndex + 1}/${state.totalQuestions}`);
                actionBtns.forEach(btn => btn.disabled = state.disabled || state.attackPhase || state.fightMode || state
                    .actMode);
            }

            optionsBtns.forEach(btn => btn.disabled = state.disabled || state.gameOver || state.attackPhase);

            actionBtns.forEach((btn, i) => {
                const isActive = i === state.menuIndex && state.focusOnButtons && state.menuActive && !state.actMode &&
                    !state.fightMode;
                btn.classList.toggle('active', isActive);
            });
        }

        // ---------- LOAD QUESTION ----------
        function loadQuestion() {
            if (state.gameOver) return;
            if (state.questionIndex >= state.totalQuestions) {
                state.gameOver = true;
                state.disabled = true;
                const victoryMsg = getBossVictory();
                setText('🏁 ¡QUIZ COMPLETADO!', ' ' + victoryMsg);
                optionsBtns.forEach(btn => btn.disabled = true);
                actionBtns.forEach(btn => btn.disabled = true);
                updateUI();
                return;
            }

            const qData = getCurrentQuestionData();
            const taunt = getBossTaunt();
            const label = state.textLabel || '📺 METTATON';
            setText(label, qData.question + '  (' + taunt + ')');
            state.answered = false;
            state.disabled = false;
            state.showingOptions = false;
            state.actMode = false;
            state.actTargets = [];
            state.fightMode = false;
            state.fightStage = null;
            state.fightBar = null;
            state.menuActive = true;
            state.focusOnButtons = true;
            state.menuIndex = 0;
            state.battleSoul.invincible = false;
            state.invincibleTimer = 0;
            state.mettatonBubble.active = false;
            textboxHeart.classList.remove('active');

            state.battleSoul.x = CW / 2;
            state.battleSoul.y = CH / 2;

            updateUI();
        }

        // ---------- HANDLE ANSWER ----------
        function handleAnswer(selectedIndex) {
            if (state.disabled || state.gameOver || state.answered) return;
            if (state.questionIndex >= state.totalQuestions) return;

            const qData = getCurrentQuestionData();
            const isCorrect = (selectedIndex === qData.correct);

            state.actionConfirmed = false;
            state.actMode = false;
            state.actTargets = [];
            state.mettatonBubble.active = false;
            stopVoiceBlips();

            state.answered = true;
            state.disabled = true;
            state.menuActive = false;
            state.focusOnButtons = true;
            textboxHeart.classList.remove('active');

            if (isCorrect) {
                state.rating += 1;
                state.hp = Math.min(state.maxHp, state.hp + 2);
                const correctMsg = getBossCorrect();
                setText('✅ ¡CORRECTO!', ' ' + correctMsg);
                setFeedback('✅ ' + correctMsg);
                startAttack(260, 4);
            } else {
                const damage = Math.max(1, Math.floor(3 + Math.random() * 3));
                state.hp = Math.max(0, state.hp - damage);
                const wrongMsg = getBossWrong();
                setText('❌ ¡INCORRECTO!', ' ' + wrongMsg + ' -' + damage + ' HP');
                setFeedback(`❌ -${damage} HP`);
                startAttack(340, 6);
            }

            updateUI();

            if (state.hp <= 0) {
                state.gameOver = true;
                state.disabled = true;
                const defeatMsg = getBossDefeat();
                setText('💀 ¡CANCELADO!', ' ' + defeatMsg);
                optionsBtns.forEach(btn => btn.disabled = true);
                actionBtns.forEach(btn => btn.disabled = true);
                updateUI();
                return;
            }

            setTimeout(() => {
                if (!state.gameOver) {
                    state.attackPhase = false;
                    state.bullets = [];
                    state.questionIndex++;
                    loadQuestion();
                }
            }, isCorrect ? 4600 : 6000);
        }

        // ---------- ATTACK PATTERNS ----------
        function spawnBullets(count) {
            const actualCount = state.bulletCount || count;
            const speedMod = state.bulletSpeed || 1;

            const bullets = [];
            const cx = BOX.x + BOX.w / 2,
                cy = BOX.y + 24;
            for (let i = 0; i < actualCount; i++) {
                const angle = (i / actualCount) * Math.PI * 2 + Math.random() * 0.3;
                const speed = (1.6 + Math.random() * 1.1) * speedMod;
                bullets.push({
                    x: cx + Math.cos(angle) * 20,
                    y: cy + Math.sin(angle) * 20,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    r: 6 + Math.random() * 4,
                    active: true
                });
            }
            state.bullets.push(...bullets);
        }

        function spawnRain(count) {
            const actualCount = state.bulletCount || count;
            const speedMod = state.bulletSpeed || 1;

            for (let i = 0; i < actualCount; i++) {
                state.bullets.push({
                    x: BOX.x + 20 + Math.random() * (BOX.w - 40),
                    y: BOX.y + 6,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (1.6 + Math.random() * 1.3) * speedMod,
                    r: 6 + Math.random() * 4,
                    active: true
                });
            }
        }

        function spawnSweep(count) {
            const actualCount = state.bulletCount || count;
            const speedMod = state.bulletSpeed || 1;
            const fromLeft = Math.random() < 0.5;
            const startY = BOX.y + 20 + Math.random() * (BOX.h - 40);
            for (let i = 0; i < actualCount; i++) {
                state.bullets.push({
                    x: fromLeft ? BOX.x + 6 : BOX.x + BOX.w - 6,
                    y: startY + (i - actualCount / 2) * 22,
                    vx: (fromLeft ? 1 : -1) * (1.7 + Math.random() * 0.8) * speedMod,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: 6 + Math.random() * 3,
                    active: true
                });
            }
        }

        function startAttack(totalFrames, waveCount) {
            const actualWaveCount = state.waveCount ? waveCount * state.waveCount : waveCount;

            state.attackPhase = true;
            state.attackTimer = totalFrames;
            state.wavesLeft = actualWaveCount;
            state.waveTimer = 0;
        }

        function fireNextWave() {
            const patterns = [spawnBullets, spawnRain, spawnSweep];
            const pattern = patterns[Math.floor(Math.random() * patterns.length)];
            pattern(pattern === spawnBullets ? 6 : 5);
            state.wavesLeft--;
        }

        // ---------- HANDLE ACTION CONFIRMATION ----------
        function confirmAction() {
            if (state.disabled || state.gameOver || state.attackPhase) return;
            if (!state.menuActive || state.actionConfirmed) return;

            playSfx(confirmSfx);

            const action = MENU_ACTIONS[state.menuIndex];
            state.actionConfirmed = true;
            state.menuActive = false;

            switch (action) {
                case 'fight':
                    startFightSelect();
                    break;
                case 'act':
                    startActMode();
                    break;
                case 'item':
                    setText('🎒 ITEM', ' NO TIENES OBJETOS.');
                    setFeedback('🎒 VACÍO');
                    state.menuActive = true;
                    state.actionConfirmed = false;
                    setTimeout(() => {
                        if (!state.gameOver) {
                            state.menuActive = true;
                            updateUI();
                        }
                    }, 1000);
                    break;
                case 'mercy':
                    const mercyMessages = [
                        "¡¿MISERICORDIA?! ¡YO SOY UN ROBOT, DARLING!",
                        "¡NO NECESITO MISERICORDIA! ¡NECESITO RATINGS!",
                        "¿MISERICORDIA? ¡ESTE ES UN QUIZ, NO UNA TELENOVELA!",
                        "¡OH! ¡QUÉ DRAMÁTICO! ¡PERO NO FUNCIONARÁ!",
                        "¡MISERICORDIA! ¡JAJAJA! ¡ERES DIVERTIDO, HUMANO!",
                        "¡LO SIENTO, DARLING! ¡MI PROGRAMA NO INCLUYE MISERICORDIA!"
                    ];
                    const randomMercy = mercyMessages[Math.floor(Math.random() * mercyMessages.length)];
                    setText('💛 MISERICORDIA', ' ' + randomMercy);
                    setFeedback('💛 ' + randomMercy);
                    state.menuActive = true;
                    state.actionConfirmed = false;
                    setTimeout(() => {
                        if (!state.gameOver) {
                            state.menuActive = true;
                            updateUI();
                        }
                    }, 1500);
                    break;
            }
            updateUI();
        }

        // ---------- FIGHT ----------
        function startFightSelect() {
            state.fightMode = true;
            state.fightStage = 'select';
            state.menuActive = false;
            state.focusOnButtons = true;
            textCursor.style.display = 'none';
            document.querySelectorAll('.answer-option').forEach(el => el.remove());

            const enemyName = state.enemy.name || 'METTATON';
            textLabel.textContent = '⚔ PELEA ';
            textMessage.textContent = '';
            updateEnemyHpDisplay(true);

            const targetEl = document.createElement('span');
            targetEl.className = 'answer-option active';
            targetEl.innerHTML = `<span class="option-heart">♥</span> * ${enemyName}`;
            targetEl.addEventListener('click', () => confirmFightTarget());
            textContent.appendChild(targetEl);

            const taunt = getBossTaunt();
            setFeedback(`⚔ PRESIONA Z PARA ELEGIR TU OBJETIVO  (${taunt})`);

            state.mettatonBubble = { active: true, text: taunt };

            startVoiceBlips();
            const duration = Math.max(500, taunt.length * 180 + 300);
            scheduleVoiceStop(duration);

            updateUI();
        }

        function confirmFightTarget() {
            if (state.fightStage !== 'select') return;
            playSfx(confirmSfx);
            document.querySelectorAll('.answer-option').forEach(el => el.remove());
            startFightBar();
        }

        function startFightBar() {
            state.fightStage = 'bar';
            const barWidth = BOX.w - 120;
            state.fightBar = {
                x: BOX.x + 60,
                w: barWidth,
                y: BOX.y + BOX.h / 2,
                h: 24,
                pos: 0,
                dir: 1,
                speed: 6 + state.rating * 0.3,
                zoneCenter: barWidth * (0.4 + Math.random() * 0.2),
                zoneHalfWidth: 30
            };
            textCursor.style.display = 'inline-block';
            const taunt = getBossTaunt();
            setText('⚔ ¡PELEA!', ' ¡PRESIONA Z CUANDO LA BARRA SE ALINEE!');
            setFeedback(`⚔ ¡CALCULA BIEN EL TIEMPO, DARLING!  (${taunt})`);
        }

        function resolveFightBar() {
            if (state.fightStage !== 'bar' || !state.fightBar) return;

            playSfx(confirmSfx);

            const bar = state.fightBar;
            const dist = Math.abs(bar.pos - bar.zoneCenter);
            let damage, label, msg, feedback;

            if (dist <= bar.zoneHalfWidth * 0.3) {
                damage = Math.floor((7 + Math.random() * 2) * state.attackMultiplier);
                label = '💥 ¡CRÍTICO!';
                msg = ' ¡GOLPE CRÍTICO!! ' + getBossTaunt();
                feedback = '💥 ¡GOLPE CRÍTICO!';
            } else if (dist <= bar.zoneHalfWidth) {
                damage = Math.floor((4 + Math.random() * 2) * state.attackMultiplier);
                label = '💥 ¡GOLPE!';
                msg = ' ¡BUEN GOLPE! ' + getBossTaunt();
                feedback = '💥 ¡BUEN GOLPE!';
            } else if (dist <= bar.zoneHalfWidth * 2) {
                damage = Math.floor((2 + Math.random() * 2) * state.attackMultiplier);
                label = '💥 ROZANDO';
                msg = ' LO ROZASTE... ' + getBossTaunt();
                feedback = '💥 ROZANDO';
            } else {
                damage = 0;
                label = '❌ ¡FALLO!';
                msg = ' ¡FALLO! ' + getBossTaunt();
                feedback = '❌ ¡FALLO!';
            }

            state.fightMode = false;
            state.fightStage = null;
            state.fightBar = null;
            state.actionConfirmed = false;
            state.mettatonBubble.active = false;
            updateEnemyHpDisplay(false);
            stopVoiceBlips();
            state.enemy.hp = Math.max(0, state.enemy.hp - damage);
            if (damage > 0) {
                playSfx(hitSfx);
                state.enemy.pulse += 0.5;
                state.slashEffect.active = true;
                state.slashEffect.timer = state.slashEffect.duration;
            }

            if (state.enemy.hp <= 0) {
                state.gameOver = true;
                const victoryMsg = getBossVictory();
                setText('💥 ¡VICTORIA!', ` ¡${state.enemy.name || 'METTATON'} DERROTADO! ${victoryMsg}`);
                setFeedback('🏆 ¡GANASTE!');
                optionsBtns.forEach(btn => btn.disabled = true);
                actionBtns.forEach(btn => btn.disabled = true);
                updateUI();
                return;
            }

            setText(label, msg);
            setFeedback(feedback);
            state.menuActive = false;
            state.focusOnButtons = true;
            updateUI();

            startAttack(damage > 0 ? 220 : 260, damage > 0 ? 3 : 4);
            updateUI();

            setTimeout(() => {
                if (!state.gameOver) {
                    state.attackPhase = false;
                    state.bullets = [];
                    state.menuActive = true;
                    updateUI();
                }
            }, damage > 0 ? 3800 : 4600);
        }

        // ---------- UPDATE ----------
        function update() {
            state.enemy.pulse += 0.04;

            let selectionChanged = false;

            if (state.menuActive && !state.gameOver && !state.attackPhase && !state.fightMode && !state.actMode) {
                if (state.focusOnButtons) {
                    let newIndex = state.menuIndex;

                    if (state.keys.up || state.keys.left) {
                        newIndex = (state.menuIndex - 1 + 4) % 4;
                        state.keys.up = false;
                        state.keys.left = false;
                        if (newIndex !== state.menuIndex) {
                            selectionChanged = true;
                            state.menuIndex = newIndex;
                        }
                    }
                    if (state.keys.down || state.keys.right) {
                        newIndex = (state.menuIndex + 1) % 4;
                        state.keys.down = false;
                        state.keys.right = false;
                        if (newIndex !== state.menuIndex) {
                            selectionChanged = true;
                            state.menuIndex = newIndex;
                        }
                    }

                    if (selectionChanged) {
                        playSfx(selectionSfx);
                        updateUI();
                    }

                    if (state.keys.z) {
                        state.keys.z = false;
                        confirmAction();
                    }
                }
            }

            if (state.actMode && state.menuActive) {
                const options = document.querySelectorAll('.answer-option');
                if (options.length > 0) {
                    let newIndex = state.menuIndex;
                    if (state.keys.up || state.keys.left) {
                        newIndex = (state.menuIndex - 1 + options.length) % options.length;
                        state.keys.up = false;
                        state.keys.left = false;
                        if (newIndex !== state.menuIndex) {
                            selectionChanged = true;
                            state.menuIndex = newIndex;
                        }
                    }
                    if (state.keys.down || state.keys.right) {
                        newIndex = (state.menuIndex + 1) % options.length;
                        state.keys.down = false;
                        state.keys.right = false;
                        if (newIndex !== state.menuIndex) {
                            selectionChanged = true;
                            state.menuIndex = newIndex;
                        }
                    }

                    if (selectionChanged) {
                        playSfx(selectionSfx);
                        updateOptionSelection();
                        updateUI();
                    }

                    if (state.keys.z) {
                        state.keys.z = false;
                        if (state.menuIndex < options.length) {
                            handleAnswer(state.menuIndex);
                        }
                    }
                }
            }

            if (state.fightMode && state.fightStage === 'bar' && state.fightBar) {
                const bar = state.fightBar;
                bar.pos += bar.dir * bar.speed;
                if (bar.pos >= bar.w) { bar.pos = bar.w;
                    bar.dir = -1; }
                if (bar.pos <= 0) { bar.pos = 0;
                    bar.dir = 1; }
            }

            const speed = 3.5;
            if (!state.gameOver && state.attackPhase) {
                if (state.keys.up && state.battleSoul.y > BOX.y + SOUL_MARGIN) state.battleSoul.y -= speed;
                if (state.keys.down && state.battleSoul.y < BOX.y + BOX.h - SOUL_MARGIN) state.battleSoul.y += speed;
                if (state.keys.left && state.battleSoul.x > BOX.x + SOUL_MARGIN) state.battleSoul.x -= speed;
                if (state.keys.right && state.battleSoul.x < BOX.x + BOX.w - SOUL_MARGIN) state.battleSoul.x += speed;
            }

            if (!state.gameOver && state.actMode) {
                if (state.keys.up && state.battleSoul.y > BOX.y + SOUL_MARGIN) state.battleSoul.y -= speed;
                if (state.keys.down && state.battleSoul.y < BOX.y + BOX.h - SOUL_MARGIN) state.battleSoul.y += speed;
                if (state.keys.left && state.battleSoul.x > BOX.x + SOUL_MARGIN) state.battleSoul.x -= speed;
                if (state.keys.right && state.battleSoul.x < BOX.x + BOX.w - SOUL_MARGIN) state.battleSoul.x += speed;
            }

            const soul = state.battleSoul;
            const bullets = state.bullets;
            let hit = false;

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (!b.active) continue;
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < BOX.x + 10 || b.x > BOX.x + BOX.w - 10) b.vx *= -0.9;
                if (b.y < BOX.y + 10 || b.y > BOX.y + BOX.h - 10) b.vy *= -0.9;
                b.x = Math.min(BOX.x + BOX.w - 10, Math.max(BOX.x + 10, b.x));
                b.y = Math.min(BOX.y + BOX.h - 10, Math.max(BOX.y + 10, b.y));

                const dx = b.x - soul.x;
                const dy = b.y - soul.y;
                if (Math.sqrt(dx * dx + dy * dy) < b.r + soul.size) {
                    hit = true;
                    b.active = false;
                    bullets.splice(i, 1);
                }
            }

            if (hit && state.attackPhase && !state.gameOver && !state.battleSoul.invincible) {
                const dmg = Math.max(1, Math.floor((2 + Math.random() * 2) * (state.damageMultiplier || 1)));
                state.hp = Math.max(0, state.hp - dmg);
                playSfx(hurtSfx);
                const taunt = getBossTaunt();
                setText('💥 ¡GOLPE!', ` -${dmg} HP  (${taunt})`);
                setFeedback(`💥 -${dmg} HP`);
                updateUI();
                state.battleSoul.invincible = true;
                state.invincibleTimer = 70;

                if (state.hp <= 0) {
                    state.gameOver = true;
                    state.disabled = true;
                    const defeatMsg = getBossDefeat();
                    setText('💀 ¡CANCELADO!', ` ${state.enemy.name || 'METTATON'} GANA! ${defeatMsg}`);
                    optionsBtns.forEach(btn => btn.disabled = true);
                    actionBtns.forEach(btn => btn.disabled = true);
                    updateUI();
                }
            }

            if (state.battleSoul.invincible) {
                state.invincibleTimer--;
                if (state.invincibleTimer <= 0) {
                    state.battleSoul.invincible = false;
                }
            }

            if (state.slashEffect.active) {
                state.slashEffect.timer--;
                if (state.slashEffect.timer <= 0) {
                    state.slashEffect.active = false;
                }
            }

            if (state.attackPhase) {
                state.attackTimer--;
                if (state.wavesLeft > 0) {
                    state.waveTimer--;
                    if (state.waveTimer <= 0) {
                        fireNextWave();
                        state.waveTimer = Math.max(20, Math.floor(state.attackTimer / (state.wavesLeft + 1)));
                    }
                }
                if (state.attackTimer <= 0) {
                    state.attackPhase = false;
                    state.bullets = [];
                    state.menuActive = true;
                    updateUI();
                }
            }

            if (!state.attackPhase && !state.gameOver && !state.fightMode && !state.actMode && state.menuActive &&
                !state.keys.up && !state.keys.down && !state.keys.left && !state.keys.right) {
                const now = performance.now() / 800;
                state.battleSoul.x += Math.sin(now) * 0.15;
                state.battleSoul.y += Math.cos(now * 0.7) * 0.15;
                state.battleSoul.x = Math.min(CW - 20, Math.max(20, state.battleSoul.x));
                state.battleSoul.y = Math.min(CH - 20, Math.max(20, state.battleSoul.y));
            }
        }

        function updateOptionSelection() {
            const options = document.querySelectorAll('.answer-option');
            options.forEach((el, idx) => {
                el.classList.toggle('active', idx === state.menuIndex);
            });
        }

        // ---------- DRAW HELPERS ----------
        function drawBattleSoul(x, y) {
            const s = state.battleSoul.size;
            const soulColor = state.soulColor || SOUL_COLORS['red'];
            const isInverted = soulColor.inverted || false;

            ctx.save();

            if (isInverted) {
                ctx.shadowColor = soulColor.shadow;
                ctx.shadowBlur = 20;

                ctx.fillStyle = soulColor.color;
                ctx.beginPath();
                ctx.moveTo(x, y - s * 0.9);
                ctx.bezierCurveTo(x - s * 1.3, y + s * 0.3, x - s * 0.5, y + s * 1.2, x, y + s * 0.35);
                ctx.bezierCurveTo(x + s * 0.5, y + s * 1.2, x + s * 1.3, y + s * 0.3, x, y - s * 0.9);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = soulColor.glow || soulColor.color;
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.moveTo(x - 2, y - s * 0.5);
                ctx.bezierCurveTo(x - s * 0.6, y + s * 0.1, x - s * 0.2, y + s * 0.6, x, y + s * 0.1);
                ctx.bezierCurveTo(x + s * 0.2, y + s * 0.6, x + s * 0.6, y + s * 0.1, x + 2, y - s * 0.5);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1.0;

                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y - s * 0.9);
                ctx.bezierCurveTo(x - s * 1.3, y + s * 0.3, x - s * 0.5, y + s * 1.2, x, y + s * 0.35);
                ctx.bezierCurveTo(x + s * 0.5, y + s * 1.2, x + s * 1.3, y + s * 0.3, x, y - s * 0.9);
                ctx.closePath();
                ctx.stroke();

            } else {
                ctx.shadowColor = soulColor.shadow;
                ctx.shadowBlur = 20;

                ctx.fillStyle = soulColor.color;
                ctx.beginPath();
                ctx.moveTo(x, y + s * 0.9);
                ctx.bezierCurveTo(x - s * 1.3, y - s * 0.3, x - s * 0.5, y - s * 1.2, x, y - s * 0.35);
                ctx.bezierCurveTo(x + s * 0.5, y - s * 1.2, x + s * 1.3, y - s * 0.3, x, y + s * 0.9);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = soulColor.glow || soulColor.color;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.moveTo(x - 2, y + s * 0.5);
                ctx.bezierCurveTo(x - s * 0.6, y - s * 0.1, x - s * 0.2, y - s * 0.6, x, y - s * 0.1);
                ctx.bezierCurveTo(x + s * 0.2, y - s * 0.6, x + s * 0.6, y - s * 0.1, x + 2, y + s * 0.5);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();
        }

        function wrapText(text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            const lines = [];
            let current = '';
            words.forEach(word => {
                const test = current ? current + ' ' + word : word;
                if (ctx.measureText(test).width > maxWidth && current) {
                    lines.push(current);
                    current = word;
                } else {
                    current = test;
                }
            });
            if (current) lines.push(current);
            const startY = y - ((lines.length - 1) * lineHeight) / 2 + 4;
            lines.forEach((line, i) => {
                ctx.fillText(line, x, startY + i * lineHeight);
            });
        }

        function drawSpeechBubble(text) {
            const ex = state.enemy.x,
                ey = state.enemy.y;
            const bw = 460,
                bh = 54;
            const bx = ex - bw / 2,
                by = 4;

            ctx.save();
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 10);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(ex - 14, by + bh - 2);
            ctx.lineTo(ex + 14, by + bh - 2);
            ctx.lineTo(ex, by + bh + 16);
            ctx.closePath();
            ctx.fillStyle = '#000000';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(ex - 14, by + bh - 2);
            ctx.lineTo(ex, by + bh + 16);
            ctx.lineTo(ex + 14, by + bh - 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '11px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            wrapText(text, ex, by + bh / 2, bw - 44, 15);
            ctx.restore();
        }

        // ---------- DRAW ----------
        function draw() {
            ctx.clearRect(0, 0, CW, CH);

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, CW, CH);

            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            for (let i = 0; i < CW; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, CH);
                ctx.stroke();
            }
            for (let i = 0; i < CH; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CW, i);
                ctx.stroke();
            }

            if (state.attackPhase || state.actMode || (state.fightMode && state.fightStage === 'bar')) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);
            }

            const ex = state.enemy.x,
                ey = state.enemy.y;
            const pulse = Math.sin(state.enemy.pulse) * 4;

            ctx.fillStyle = '#ffffff';
            ctx.font = '14px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(state.enemy.name || 'METTATON', ex, ey - 52 + pulse);

            if (currentSprite && currentSprite.complete && currentSprite.naturalWidth > 0) {
                const sw = 120,
                    sh = 120 * (currentSprite.naturalHeight / currentSprite.naturalWidth || 1);
                ctx.save();
                ctx.shadowColor = 'rgba(255,255,255,0.25)';
                ctx.shadowBlur = 18;
                ctx.drawImage(currentSprite, ex - sw / 2, ey - sh / 2 + pulse, sw, sh);
                ctx.restore();
            } else {
                ctx.shadowColor = 'rgba(255,255,255,0.3)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.roundRect(ex - 35, ey - 35 + pulse, 70, 70, 14);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#222222';
                ctx.beginPath();
                ctx.arc(ex, ey - 4 + pulse, 22, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ex - 12, ey - 8 + pulse, 6, 0, Math.PI * 2);
                ctx.arc(ex + 12, ey - 8 + pulse, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(ex - 14, ey - 10 + pulse, 2.5, 0, Math.PI * 2);
                ctx.arc(ex + 10, ey - 10 + pulse, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(ex, ey + 8 + pulse, 10, 0.1, Math.PI - 0.1);
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#333333';
                ctx.font = '8px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('← SPRITE HERE →', ex, ey + 50 + pulse);
            }

            if (state.slashEffect.active) {
                const t = state.slashEffect.timer / state.slashEffect.duration;
                if (state.slashEffect.timer > state.slashEffect.duration - 4) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.fillRect(0, 0, CW, CH);
                }
                const len = 100;
                ctx.save();
                ctx.globalAlpha = Math.max(0, t);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3 + 5 * t;
                ctx.shadowColor = 'rgba(255,255,255,0.9)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(ex - len / 2, ey - len / 2);
                ctx.lineTo(ex + len / 2, ey + len / 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ex + len / 2, ey - len * 0.3);
                ctx.lineTo(ex - len / 2, ey + len * 0.3);
                ctx.stroke();
                ctx.restore();
            }

            if (state.mettatonBubble.active) {
                drawSpeechBubble(state.mettatonBubble.text);
            }

            if (state.actMode) {
                state.actTargets.forEach(t => {
                    const dx = state.battleSoul.x - t.x,
                        dy = state.battleSoul.y - t.y;
                    const soulInside = (dx * dx + dy * dy) < t.r * t.r;

                    ctx.setLineDash(soulInside ? [] : [5, 5]);
                    ctx.strokeStyle = soulInside ? '#ffffff' : '#777777';
                    ctx.lineWidth = soulInside ? 3 : 2;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    if (soulInside) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = soulInside ? '#ffffff' : '#aaaaaa';
                    ctx.font = '11px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    wrapText(t.label, t.x, t.y, t.r * 1.7, 14);
                });
            }

            if (state.fightMode && state.fightStage === 'bar' && state.fightBar) {
                const bar = state.fightBar;
                const barTop = bar.y - bar.h / 2;

                ctx.fillStyle = '#333333';
                ctx.font = '11px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('¡PRESIONA Z!', bar.x + bar.w / 2, barTop - 18);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(bar.x, barTop, bar.w, bar.h);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.fillRect(bar.x + bar.zoneCenter - bar.zoneHalfWidth, barTop, bar.zoneHalfWidth * 2, bar.h);

                ctx.fillStyle = '#ff4444';
                ctx.fillRect(bar.x + bar.pos - 3, barTop - 6, 6, bar.h + 12);
            }

            ctx.shadowColor = 'rgba(255,255,255,0.5)';
            ctx.shadowBlur = 15;
            for (const b of state.bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.fillStyle = '#888888';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(b.x - 2, b.y - 2, b.r * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            if (state.attackPhase || state.actMode) {
                const flickerOff = state.battleSoul.invincible && Math.floor(state.invincibleTimer / 4) % 2 === 0;
                if (!flickerOff) drawBattleSoul(state.battleSoul.x, state.battleSoul.y);
            }

            if (state.attackPhase) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.fillRect(0, 0, CW, CH);
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('⚡ ¡ESQUIVA!', CW / 2, 30);
            }
        }

        // ---------- CANVAS POLYFILL ----------
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // ---------- GAME LOOP ----------
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- RESET - SOLO RECARGA LA PÁGINA ----------
        function resetGame() {
            location.reload();
        }

        // ---------- EVENT LISTENERS ----------
        optionsBtns.forEach((btn, idx) => {
            btn.addEventListener('click', () => handleAnswer(idx));
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;

            if (document.activeElement === nameInput) {
                return;
            }

            if (key === 'ArrowUp') { e.preventDefault();
                state.keys.up = true; }
            if (key === 'ArrowDown') { e.preventDefault();
                state.keys.down = true; }
            if (key === 'ArrowLeft') { e.preventDefault();
                state.keys.left = true; }
            if (key === 'ArrowRight') { e.preventDefault();
                state.keys.right = true; }

            if (key === 'z' || key === 'Z') {
                e.preventDefault();
                state.keys.z = true;
                if (state.fightMode && state.fightStage === 'select') {
                    confirmFightTarget();
                } else if (state.fightMode && state.fightStage === 'bar') {
                    resolveFightBar();
                } else if (state.actMode) {
                    selectActTarget();
                } else if (state.menuActive && !state.actionConfirmed) {
                    confirmAction();
                }
            }

            if (key === 'x' || key === 'X') {
                e.preventDefault();
                state.keys.x = true;

                if (state.fightMode) {
                    state.fightMode = false;
                    state.fightStage = null;
                    state.fightBar = null;
                    updateEnemyHpDisplay(false);
                    state.mettatonBubble.active = false;
                    stopVoiceBlips();
                    document.querySelectorAll('.answer-option').forEach(el => el.remove());
                    resetMenuState();
                    const taunt = getBossTaunt();
                    setText('📺 METTATON', ' ¡COBARDE! ' + taunt);
                    setFeedback('😤 HUISTE');
                } else if (state.actMode) {
                    state.actMode = false;
                    state.actTargets = [];
                    state.mettatonBubble.active = false;
                    stopVoiceBlips();
                    document.querySelectorAll('.answer-option').forEach(el => el.remove());
                    state.menuActive = true;
                    state.focusOnButtons = true;
                    state.actionConfirmed = false;
                    state.menuIndex = 1;
                    const qData = getCurrentQuestionData();
                    const taunt = getBossTaunt();
                    setText('📺 METTATON', qData.question + ' (' + taunt + ')');
                    updateUI();
                } else if (!state.gameOver && !state.attackPhase) {
                    resetMenuState();
                }
            }

            if (key === 'r' || key === 'R') {
                e.preventDefault();
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key;

            if (document.activeElement === nameInput) {
                return;
            }

            if (key === 'ArrowUp') { e.preventDefault();
                state.keys.up = false; }
            if (key === 'ArrowDown') { e.preventDefault();
                state.keys.down = false; }
            if (key === 'ArrowLeft') { e.preventDefault();
                state.keys.left = false; }
            if (key === 'ArrowRight') { e.preventDefault();
                state.keys.right = false; }
            if (key === 'z' || key === 'Z') { state.keys.z = false; }
            if (key === 'x' || key === 'X') { state.keys.x = false; }
        });

        resetBtn.addEventListener('click', resetGame);

        // ---- INIT ----
        state.enemy.hp = 12;
        state.enemy.maxHp = 12;
        setText('📺 METTATON', ' ¡BIENVENIDO, DARLING!');
        gameLoop();

        console.log('📚 METTATON QUIZ - REFUERZO ESCOLAR');
        console.log('⬆⬇⬅➡  Navega el menú/opciones con las flechas');
        console.log('Z  Confirma acción / Selecciona respuesta / Ataca en modo PELEA');
        console.log('X  Cancela modo PELEA o sale del modo ACT');
        console.log('R  Recarga la página');
        console.log('📚 Materias: Matemáticas, Lectura, Ciencias, Historia, Geografía, Computación, Arte, Música');
        console.log('💛 MERCY: Mensajes graciosos de Mettaton');
        console.log('🔑 Nombres secretos: Tina, Toe, Susie, Chara, Kris, Frisk, Sans, Gaster, Temmie');
    </script>
